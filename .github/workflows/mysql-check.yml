name: MySQL lab check
on: [push, workflow_dispatch]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL 8.4
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Run queries and export database
        run: |
          mkdir -p results
          docker compose exec -T mysql sh -c 'exec mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" restaurant_db' < 03_queries.sql > results/query-results.txt
          docker compose exec -T mysql sh -c 'exec mysqldump --default-character-set=utf8mb4 --no-tablespaces -uroot -p"$MYSQL_ROOT_PASSWORD" restaurant_db' > results/restaurant_db_dump.sql
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-db-results
          path: results/
