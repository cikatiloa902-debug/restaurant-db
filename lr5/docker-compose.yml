name: restaurant-lr5

x-mysql: &mysql
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bash scripts/init_env.sh}
    MYSQL_ROOT_HOST: localhost

x-health: &health
  interval: 5s
  timeout: 4s
  start_period: 40s
  retries: 20

services:
  primary:
    <<: *mysql
    build:
      context: .
      target: primary
    ports:
      - "127.0.0.1:${PRIMARY_PORT:-3307}:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - primary_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bash scripts/init_env.sh}
      MYSQL_ROOT_HOST: localhost
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?Run bash scripts/init_env.sh}
    healthcheck:
      <<: *health
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = mysqld && MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=SOCKET -uroot restaurant_db -e 'SELECT 1 FROM chef_specialty LIMIT 1' >/dev/null

  replica:
    <<: *mysql
    build:
      context: .
      target: replica
    ports:
      - "127.0.0.1:${REPLICA_PORT:-3308}:3306"
    volumes:
      - replica_data:/var/lib/mysql
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      <<: *health
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = mysqld && MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=SOCKET -uroot -e 'SELECT 1' >/dev/null

volumes:
  primary_data:
  replica_data:
