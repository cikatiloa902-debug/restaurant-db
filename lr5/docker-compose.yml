name: restaurant-lr5

x-mysql: &mysql
  image: mysql:8.0
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_db}

x-health: &mysql-health
  interval: 4s
  timeout: 4s
  start_period: 40s
  retries: 20

services:
  primary:
    <<: *mysql
    ports:
      - "127.0.0.1:${PRIMARY_PORT:-3307}:3306"
    volumes:
      - ./conf/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - primary_data:/var/lib/mysql
    healthcheck:
      <<: *mysql-health
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot "$$MYSQL_DATABASE" -e 'SELECT COUNT(*) FROM chef_specialty' >/dev/null

  replica:
    <<: *mysql
    ports:
      - "127.0.0.1:${REPLICA_PORT:-3308}:3306"
    volumes:
      - ./conf/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - replica_data:/var/lib/mysql
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      <<: *mysql-health
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null

volumes:
  primary_data:
  replica_data:
